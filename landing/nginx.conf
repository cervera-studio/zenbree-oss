server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's directory redirect (/en -> /en/) would otherwise send Location: http://<host>:8080/en/, a port only the container sees.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ @app;
    }

    # The app used to live on this host: an old link (/lists, /auth/..., /u/<token>) keeps working on the app's host.
    # __APP_URL__ is PUBLIC_APP_URL, filled in at build time (Dockerfile).
    location @app {
        return 308 __APP_URL__$request_uri;
    }
}
