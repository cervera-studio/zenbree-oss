<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Zenbree · Menu mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./fonts.css">
<style>
:root{--zb-bg:#f8fcfb;--zb-fg:#07191d;--zb-card:#f2f7f6;--zb-muted:#edf3f2;--zb-muted-fg:#596669;--zb-border:#d5e1df;--zb-brand:#006679;--zb-brand-hover:#00576a;--zb-ink:#006679;--zb-ink-hover:#004d5c;--zb-on-brand:#f8fcfb;--zb-tint:#d0f0f9;--zb-rail:#e6f0ee;--zb-rail-hover:#dde9e7;--zb-pos-fg:#007a55;--zb-warn-fg:#bb4d00;--zb-neg-fg:#c10007;--zb-ai-fg:#8200db;--zb-info-fg:#1447e6;--zb-neu-fg:#314158;--zb-social-fg:#007595;--zb-chart-3:#ba7e15}
.zb-dark{color-scheme:dark;--zb-bg:#0e1515;--zb-fg:#ecf1f1;--zb-card:#141c1b;--zb-muted:#1a2221;--zb-muted-fg:#929e9d;--zb-border:#27302f;--zb-brand:#03758b;--zb-brand-hover:#036a7e;--zb-ink:#69c7df;--zb-ink-hover:#8fdbf0;--zb-on-brand:#f8fcfb;--zb-tint:#093641;--zb-rail:#101817;--zb-rail-hover:#1a2322;--zb-pos-fg:#5ee9b5;--zb-warn-fg:#ffd230;--zb-neg-fg:#ff6467;--zb-ai-fg:#dab2ff;--zb-info-fg:#8ec5ff;--zb-neu-fg:#cad5e2;--zb-social-fg:#53eafd;--zb-chart-3:#ebb260}
body{margin:0}
</style>
</helmet>
<div class="{{themeClass}}" style="position: fixed; inset: 0; z-index: 60; display: flex; font-family: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif; color: var(--zb-fg); font-size: 15px">
  <nav aria-label="Navigazione principale" style="width: 300px; max-width: 84%; box-sizing: border-box; height: 100%; overflow-y: auto; background: var(--zb-rail); padding: 16px 12px; display: flex; flex-direction: column; gap: 16px; box-shadow: 8px 0 32px -12px rgba(7,25,29,0.35)">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none"><rect x="1" y="1" width="22" height="22" rx="7" style="fill: var(--zb-brand)"></rect><path d="M7 8.5h10L7 15.5h10" stroke="#f8fcfb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size: 18px; font-weight: 700; flex-grow: 1">zenbree</span>
      <button type="button" aria-label="Chiudi menu" onClick="{{close}}" style="width: 44px; height: 44px; border: 0; border-radius: 10.5px; background: transparent; color: var(--zb-fg); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>
    <a href="{{nav.home}}" style="height: 48px; border-radius: 14px; background: var(--zb-brand); color: var(--zb-on-brand); text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nuova chat
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="4">
        <a href="{{i.href}}" aria-current="{{i.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 12px; text-decoration: none; background: {{i.bg}}; color: {{i.fg}}; font-weight: {{i.w}}">
          <span style="flex-grow: 1">{{i.label}}</span>
          <sc-if value="{{i.badge}}" hint-placeholder-val="{{false}}"><span style="height: 22px; min-width: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 999px; background: {{i.badgeBg}}; color: {{i.badgeFg}}; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{i.badge}}</span></sc-if>
        </a>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--zb-muted-fg); padding: 0 12px 6px">Chat con l'agente</span>
      <a href="{{nav.chat}}" style="display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 12px; text-decoration: none; color: var(--zb-fg)"><span style="font-weight: 600">Trova CEO di agenzie marketing a Milano</span><span style="font-size: 12px; color: var(--zb-muted-fg)">2 liste · 47 persone, 31 aziende</span></a>
      <a href="{{nav.chat}}" style="display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 12px; text-decoration: none; color: var(--zb-fg)"><span style="font-weight: 600">SaaS italiane che assumono AE</span><span style="font-size: 12px; color: var(--zb-warn-fg)">Nessun risultato · scegli come procedere</span></a>
    </div>
    <span style="flex-grow: 1"></span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-top: 1px solid var(--zb-border)">
      <span style="width: 36px; height: 36px; border-radius: 999px; background: var(--zb-brand); color: var(--zb-on-brand); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">AP</span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 600">Ale Poli</span><span style="font-size: 12px; color: var(--zb-muted-fg)">Ritmo Sales · 942 crediti</span></span>
      <a href="{{nav.profile}}" style="font-size: 14px; font-weight: 600; text-decoration: none">Profilo</a>
    </div>
  </nav>
  <button type="button" aria-label="Chiudi menu" onClick="{{close}}" style="flex-grow: 1; border: 0; background: rgba(7,25,29,0.45); cursor: pointer"></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"active":{"editor":"enum","options":["home","lists","campaigns","inbox"],"default":"home"},"onClose":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const a = this.props.active ?? 'home';
    const h = (p) => (theme === 'dark' ? 'Dark-' : '') + p;
    const I = (k, label, href, badge, warn) => {
      const on = a === k;
      return { label, href: h(href), current: on ? 'page' : 'false', bg: on ? 'var(--zb-tint)' : 'transparent', fg: on ? 'var(--zb-ink)' : 'var(--zb-fg)', w: on ? '600' : '500',
        badge: badge || false, badgeBg: warn ? 'rgba(254,154,0,0.18)' : 'var(--zb-brand)', badgeFg: warn ? 'var(--zb-warn-fg)' : 'var(--zb-on-brand)' };
    };
    return {
      themeClass: theme === 'dark' ? 'zb-dark' : '',
      close: () => { if (this.props.onClose) this.props.onClose(); },
      nav: { home: h('M-Home.dc.html'), chat: h('M-Chat.dc.html'), profile: h('Set-Profile.dc.html') },
      items: [
        I('home', 'Home', 'M-Home.dc.html'),
        I('lists', 'Liste', 'M-List.dc.html', '6'),
        I('campaigns', 'Da approvare', 'M-Approve.dc.html', '12', true),
        I('inbox', 'Risposte', 'M-Inbox.dc.html', '2')
      ]
    };
  }
}
</script>
</body>
</html>
