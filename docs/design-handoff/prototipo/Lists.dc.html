<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Zenbree · Liste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./fonts.css">
<style>
:root{--zb-bg:#f8fcfb;--zb-fg:#07191d;--zb-card:#f2f7f6;--zb-muted:#edf3f2;--zb-muted-fg:#596669;--zb-border:#d5e1df;--zb-brand:#006679;--zb-brand-hover:#00576a;--zb-ink:#006679;--zb-ink-hover:#004d5c;--zb-on-brand:#f8fcfb;--zb-tint:#d0f0f9;--zb-rail:#e6f0ee;--zb-rail-hover:#dde9e7;--zb-pos-fg:#007a55;--zb-warn-fg:#bb4d00;--zb-neg-fg:#c10007;--zb-ai-fg:#8200db;--zb-info-fg:#1447e6;--zb-neu-fg:#314158;--zb-social-fg:#007595}
.zb-dark{color-scheme:dark;--zb-bg:#0e1515;--zb-fg:#ecf1f1;--zb-card:#141c1b;--zb-muted:#1a2221;--zb-muted-fg:#929e9d;--zb-border:#27302f;--zb-brand:#03758b;--zb-brand-hover:#036a7e;--zb-ink:#69c7df;--zb-ink-hover:#8fdbf0;--zb-on-brand:#f8fcfb;--zb-tint:#093641;--zb-rail:#101817;--zb-rail-hover:#1a2322;--zb-pos-fg:#5ee9b5;--zb-warn-fg:#ffd230;--zb-neg-fg:#ff6467;--zb-ai-fg:#dab2ff;--zb-info-fg:#8ec5ff;--zb-neu-fg:#cad5e2;--zb-social-fg:#53eafd}
body{margin:0;background:var(--zb-bg)}
a{color:var(--zb-ink)}a:hover{color:var(--zb-ink-hover)}
.zb-row{transition:background 190ms cubic-bezier(0.4,0,1,1)}
.zb-row:hover{background:var(--zb-muted);transition-duration:110ms}
.zb-link{color:var(--zb-fg);font-weight:600;text-decoration:none}
.zb-link:hover{color:var(--zb-ink);text-decoration:underline}
</style>
</helmet>
<div class="{{themeClass}}" style="display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; background: var(--zb-bg); color: var(--zb-fg); font-family: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif; font-size: 14px">
  <dc-import name="Sidebar" theme="{{theme}}" active="lists" credits="942" credits-pct="46%" hint-size="248px,100vh"></dc-import>

  <main style="display: flex; flex-direction: column; gap: 24px; padding: 40px 40px">
    <div style="display: flex; align-items: flex-end; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-family: Newsreader, 'Iowan Old Style', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1.18; letter-spacing: 0">Liste</h1>
        <p style="margin: 0; font-size: 14px; color: var(--zb-muted-fg)">I risultati delle tue chat: righe, colonne ed esportazioni. Per cambiare una lista, torna nella chat da cui è nata.</p>
      </div>
      <span style="flex-grow: 1"></span>
      <button type="button" onClick="{{openImport}}" style="height: 38px; padding: 0 14px; border-radius: 10.5px; border: 1px solid var(--zb-border); background: var(--zb-bg); color: var(--zb-fg); font-family: inherit; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>
        Carica CSV
      </button>
      <a href="{{nav.home}}" style="height: 38px; padding: 0 16px; border-radius: 10.5px; background: var(--zb-brand); color: var(--zb-on-brand); text-decoration: none; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Nuova lista
      </a>
    </div>

    <div style="border: 1px solid var(--zb-border); border-radius: 14px; overflow: hidden">
      <table style="width: 100%; border-collapse: collapse; font-size: 13px">
        <thead>
          <tr style="background: var(--zb-rail); text-align: left">
            <th scope="col" style="padding: 10px 16px; font-weight: 600; font-size: 12px; color: var(--zb-muted-fg)">Nome</th>
            <th scope="col" style="padding: 10px 16px; font-weight: 600; font-size: 12px; color: var(--zb-muted-fg)">Tipo</th>
            <th scope="col" style="padding: 10px 16px; font-weight: 600; font-size: 12px; color: var(--zb-muted-fg)">Stato</th>
            <th scope="col" style="padding: 10px 16px; font-weight: 600; font-size: 12px; color: var(--zb-muted-fg); text-align: right">Consegnate</th>
            <th scope="col" style="padding: 10px 16px; font-weight: 600; font-size: 12px; color: var(--zb-muted-fg); text-align: right">Costo per lead</th>
            <th scope="col" style="padding: 10px 16px; font-weight: 600; font-size: 12px; color: var(--zb-muted-fg)">Nata da</th>
            <th scope="col" style="padding: 10px 16px; font-weight: 600; font-size: 12px; color: var(--zb-muted-fg)">Creata</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{lists}}" as="l" hint-placeholder-count="5">
            <tr class="zb-row" style="border-top: 1px solid var(--zb-muted)">
              <td style="padding: 14px 16px">
                <div style="display: flex; flex-direction: column; gap: 2px">
                  <a href="{{l.href}}" class="zb-link">{{l.name}}</a>
                  <span style="font-size: 12px; color: var(--zb-muted-fg)">{{l.brief}}</span>
                </div>
              </td>
              <td style="padding: 14px 16px; white-space: nowrap">
                <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: var(--zb-rail); font-size: 12px; display: inline-flex; align-items: center; white-space: nowrap">{{l.kind}}</span>
              </td>
              <td style="padding: 14px 16px; white-space: nowrap">
                <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{l.sBg}}; color: {{l.sFg}}; white-space: nowrap">
                  <span style="width: 6px; height: 6px; border-radius: 999px; background: {{l.sDot}}"></span>{{l.status}}
                </span>
              </td>
              <td style="padding: 14px 16px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap"><strong>{{l.done}}</strong><span style="color: var(--zb-muted-fg)"> di {{l.total}}</span></td>
              <td style="padding: 14px 16px; text-align: right; font-variant-numeric: tabular-nums; color: var(--zb-muted-fg)">{{l.cpl}}</td>
              <td style="padding: 14px 16px; max-width: 260px">
                <a href="{{l.chatHref}}" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; text-decoration: none; color: var(--zb-muted-fg); max-width: 100%">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                  <span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{l.chat}}</span>
                </a>
              </td>
              <td style="padding: 14px 16px; color: var(--zb-muted-fg); white-space: nowrap">{{l.date}}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>
  <sc-if value="{{importOpen}}" hint-placeholder-val="{{false}}">
    <dc-import name="ImportDialog" theme="{{theme}}" step="{{importStep}}" on-close="{{closeImport}}" hint-size="100%,100vh"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"dialog":{"editor":"enum","options":["none","import"],"default":"none"},"importStep":{"editor":"enum","options":["upload","tooLarge","map","review","done"],"default":"upload"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  _href(p) {
    return ((this.props.theme ?? 'light') === 'dark' ? 'Dark-' : '') + p;
  }
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const h = (p) => this._href(p);
    const nav = { home: h('Main.dc.html'), question: h('Chat-Question.dc.html'), plan: h('Chat-Plan.dc.html'), running: h('Chat-Running.dc.html'), list: h('List.dc.html'), lists: h('Lists.dc.html'), companies: h('Companies.dc.html') };
    const st = this.state || {};
    const open = st.importOpen ?? ((this.props.dialog ?? 'none') === 'import');
    return { ...this._vals(), theme, nav, themeClass: theme === 'dark' ? 'zb-dark' : '',
      importOpen: open, importStep: this.props.importStep ?? 'upload',
      openImport: () => this.setState({ importOpen: true }), closeImport: () => this.setState({ importOpen: false }) };
  }
  _vals() {
    const ST = {
      done: { status: 'Completato', sBg: 'rgba(0,188,125,0.12)', sFg: 'var(--zb-pos-fg)', sDot: '#00bc7d' },
      run: { status: 'In corso', sBg: 'var(--zb-tint)', sFg: 'var(--zb-ink)', sDot: 'var(--zb-brand)' },
      ask: { status: 'Serve una risposta', sBg: 'rgba(254,154,0,0.14)', sFg: 'var(--zb-warn-fg)', sDot: '#fe9a00' },
      draft: { status: 'Piano da approvare', sBg: 'rgba(43,127,255,0.12)', sFg: 'var(--zb-info-fg)', sDot: '#2b7fff' }
    };
    const L = (name, brief, kind, st, done, total, cpl, date, href, chat, chatHref) => ({ name, brief, kind, ...ST[st], done, total, cpl, date, href, chat, chatHref });
    return {
      lists: [
        L('Agenzie marketing Milano · SDR', 'CEO o resp. commerciale, email verificata', 'Persone', 'done', '47', '50', '6,3', 'Oggi, 11:42', this._href('List.dc.html'), 'Trova CEO di agenzie marketing a Milano', this._href('Chat-Running.dc.html')),
        L('Agenzie marketing Milano · aziende', 'Agenzie di marketing, 10–50 dipendenti, con segnale SDR', 'Aziende', 'done', '31', '31', '1,6', 'Oggi, 11:20', this._href('Companies.dc.html'), 'Trova CEO di agenzie marketing a Milano', this._href('Chat-Running.dc.html')),
        L('Resp. marketing tech 50–200', 'Head of marketing in aziende tech italiane', 'Persone', 'run', '64', '100', '5,8', 'Oggi, 09:15', this._href('List.dc.html'), 'Responsabili marketing nel tech', this._href('Chat-Error.dc.html')),
        L('SaaS Italia · AE', 'Aziende con annunci Account Executive', 'Aziende', 'ask', '0', '40', '—', 'Ieri', this._href('Chat-NoResults.dc.html'), 'SaaS italiane che assumono AE', this._href('Chat-NoResults.dc.html')),
        L('fiere_2026.csv', '312 righe importate, email e telefono', 'Arricchimento', 'done', '241', '312', '2,4', '29 set', this._href('List.dc.html'), 'Completa le email di fiere_2026.csv', this._href('List.dc.html')),
        L('Studi dentistici Torino', 'Titolari di studi con 2+ poltrone', 'Persone', 'draft', '0', '80', '—', '28 set', this._href('Chat-NoCredits.dc.html'), 'Titolari di studi dentistici a Torino', this._href('Chat-NoCredits.dc.html'))
      ]
    };
  }
}
</script>
</body>
</html>
