<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Zenbree · Nessuna risposta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./fonts.css">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 100vh">
  <dc-import name="Inbox" theme="{{theme}}" empty="{{yes}}" hint-size="100%,100vh"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'light', yes: true }; }
}
</script>
</body>
</html>
