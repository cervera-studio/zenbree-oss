<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Zenbree · Lista mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./fonts.css">
<style>
:root{--zb-bg:#f8fcfb;--zb-fg:#07191d;--zb-card:#f2f7f6;--zb-muted:#edf3f2;--zb-muted-fg:#596669;--zb-border:#d5e1df;--zb-brand:#006679;--zb-brand-hover:#00576a;--zb-ink:#006679;--zb-ink-hover:#004d5c;--zb-on-brand:#f8fcfb;--zb-tint:#d0f0f9;--zb-rail:#e6f0ee;--zb-rail-hover:#dde9e7;--zb-pos-fg:#007a55;--zb-warn-fg:#bb4d00;--zb-neg-fg:#c10007;--zb-ai-fg:#8200db;--zb-info-fg:#1447e6;--zb-neu-fg:#314158;--zb-social-fg:#007595;--zb-chart-3:#ba7e15}
.zb-dark{color-scheme:dark;--zb-bg:#0e1515;--zb-fg:#ecf1f1;--zb-card:#141c1b;--zb-muted:#1a2221;--zb-muted-fg:#929e9d;--zb-border:#27302f;--zb-brand:#03758b;--zb-brand-hover:#036a7e;--zb-ink:#69c7df;--zb-ink-hover:#8fdbf0;--zb-on-brand:#f8fcfb;--zb-tint:#093641;--zb-rail:#101817;--zb-rail-hover:#1a2322;--zb-pos-fg:#5ee9b5;--zb-warn-fg:#ffd230;--zb-neg-fg:#ff6467;--zb-ai-fg:#dab2ff;--zb-info-fg:#8ec5ff;--zb-neu-fg:#cad5e2;--zb-social-fg:#53eafd;--zb-chart-3:#ebb260}
body{margin:0;background:var(--zb-bg)}
a{color:var(--zb-ink)}
.m-card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%;padding:14px;border-radius:17.5px;background:var(--zb-card);border:1px solid var(--zb-border)}
.m-card:focus-visible{outline:2px solid var(--zb-ink);outline-offset:2px}
</style>
</helmet>
<div class="{{themeClass}}" style="min-height: 100vh; display: flex; flex-direction: column; background: var(--zb-bg); color: var(--zb-fg); font-family: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif; font-size: 15px">
  <header style="position: sticky; top: 0; z-index: 5; background: var(--zb-bg); border-bottom: 1px solid var(--zb-border)">
    <div style="height: 56px; display: flex; align-items: center; gap: 6px; padding: 0 8px">
      <a href="{{nav.chat}}" aria-label="Torna alla chat" style="width: 44px; height: 44px; border-radius: 10.5px; color: var(--zb-fg); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25">
        <h1 style="margin: 0; font-size: 15px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">Agenzie marketing Milano · SDR</h1>
        <span style="font-size: 12px; color: var(--zb-muted-fg)">Persone · 47 consegnate di 50 · 298 crediti</span>
      </div>
      <button type="button" aria-label="Apri menu" onClick="{{openMenu}}" style="width: 44px; height: 44px; border: 0; border-radius: 10.5px; background: transparent; color: var(--zb-fg); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
    </div>
    <div role="tablist" aria-label="Filtra righe" style="display: flex; gap: 6px; padding: 0 16px 10px; overflow-x: auto">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.border}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{t.bg}}; color: {{t.fg}}; white-space: nowrap">{{t.label}} {{t.count}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 104px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <button type="button" class="m-card" onClick="{{r.open}}">
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; background: var(--zb-tint); color: var(--zb-ink); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">{{r.fit}}</span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-weight: 700">{{r.name}}</span>
            <span style="font-size: 13px; color: var(--zb-muted-fg); overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{r.role}} · {{r.company}}</span>
          </span>
        </span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 13px">
          <span style="flex-grow: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--zb-muted-fg)">{{r.email}}</span>
          <span style="flex-shrink: 0; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap; background: {{r.chipBg}}; color: {{r.chipFg}}">{{r.chip}}</span>
        </span>
      </button>
    </sc-for>
  </main>

  <div style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 8px; padding: 12px 16px 20px; background: var(--zb-bg); border-top: 1px solid var(--zb-border)">
    <button type="button" style="height: 50px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--zb-border); background: var(--zb-bg); color: var(--zb-fg); font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; white-space: nowrap">Esporta CSV</button>
    <a href="{{nav.approve}}" style="flex-grow: 1; height: 50px; border-radius: 14px; background: var(--zb-brand); color: var(--zb-on-brand); text-decoration: none; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; white-space: nowrap">Avvia campagna</a>
  </div>

  <sc-if value="{{sel}}" hint-placeholder-val="{{false}}">
    <div style="position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end">
      <button type="button" aria-label="Chiudi dettaglio" onClick="{{close}}" style="flex-grow: 1; border: 0; background: rgba(7,25,29,0.45); cursor: pointer"></button>
      <section role="dialog" aria-modal="true" aria-labelledby="sh-t" style="max-height: 82vh; overflow-y: auto; background: var(--zb-bg); border-radius: 21px 21px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -12px 32px -12px rgba(7,25,29,0.35)">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: var(--zb-border)"></span>
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 48px; height: 48px; border-radius: 999px; background: var(--zb-tint); color: var(--zb-ink); display: flex; align-items: center; justify-content: center; font-weight: 700">{{sel.initials}}</span>
          <div style="flex-grow: 1; display: flex; flex-direction: column">
            <h2 id="sh-t" style="margin: 0; font-size: 18px; font-weight: 700">{{sel.name}}</h2>
            <span style="font-size: 14px; color: var(--zb-muted-fg)">{{sel.role}} · {{sel.company}}</span>
          </div>
          <span style="font-size: 13px; color: var(--zb-muted-fg); text-align: right">Fit<br><strong style="font-size: 18px; color: var(--zb-fg)">{{sel.fit}}</strong></span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <a href="#" style="height: 48px; border-radius: 14px; border: 1px solid var(--zb-border); color: var(--zb-fg); text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">Copia email</a>
          <a href="#" style="height: 48px; border-radius: 14px; border: 1px solid var(--zb-border); color: var(--zb-fg); text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">Apri LinkedIn</a>
        </div>
        <div style="padding: 14px; border-radius: 14px; background: var(--zb-card); border: 1px solid var(--zb-border); display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.5">
          <span style="font-size: 12px; font-weight: 600; color: var(--zb-ai-fg)">Perché è in target · Ricerca AI</span>
          <span>{{sel.why}}</span>
          <a href="#" style="font-size: 13px; text-decoration: none">Fonte: {{sel.src}}</a>
        </div>
        <div role="group" aria-label="Valuta" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" aria-pressed="{{goodPressed}}" onClick="{{rateGood}}" style="height: 48px; border-radius: 14px; border: 1px solid {{goodBorder}}; background: {{goodBg}}; color: {{goodFg}}; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer">In target</button>
          <button type="button" aria-pressed="{{badPressed}}" onClick="{{rateBad}}" style="height: 48px; border-radius: 14px; border: 1px solid {{badBorder}}; background: {{badBg}}; color: {{badFg}}; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer">Fuori target</button>
        </div>
      </section>
    </div>
  </sc-if>

  <sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
    <dc-import name="MDrawer" theme="{{theme}}" active="lists" on-close="{{closeMenu}}" hint-size="100%,100vh"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { menu: false, tab: 'all', sel: null, ratings: {} }; }
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const h = (p) => (theme === 'dark' ? 'Dark-' : '') + p;
    const S = this.state;
    const D = [
      ['r1', 'Giulia Ferri', 'CEO', 'Officina Nove', 'giulia.ferri@officinanove.it', 'ok', 92, 'Cerca il primo SDR per l’outbound verso aziende industriali lombarde.', 'officinanove.it/lavora-con-noi'],
      ['r2', 'Marco Bellini', 'Resp. commerciale', 'Studio Brezza', 'm.bellini@studiobrezza.com', 'ok', 88, 'Ha aperto una sede a Torino e sta allargando il team new business.', 'studiobrezza.com/news'],
      ['r3', 'Chiara Gallo', 'Founder e CEO', 'Lanterna Digital', 'chiara@lanternadigital.it', 'ok', 85, 'Agenzia performance in crescita: 6 assunzioni negli ultimi 12 mesi.', 'linkedin.com/company/lanterna-digital'],
      ['r4', 'Elena Moretti', 'CEO', 'Ponte Creativo', 'e.moretti@pontecreativo.it', 'ok', 81, 'Vende progetti di brand a PMI, cerca SDR con inglese per l’estero.', 'pontecreativo.it/careers'],
      ['r7', 'Davide Rinaldi', 'Head of sales', 'Quadrante Media', 'd.rinaldi@quadrantemedia.it', 'catch', 76, 'Team commerciale di 3 persone, cerca il quarto profilo junior.', 'quadrantemedia.it/jobs'],
      ['r5', 'Luca Conti', 'Business director', 'Nodo Agency', 'luca.conti@nodoagency.com', 'ok', 79, 'Agenzia HubSpot partner: vende retainer a software house italiane.', 'nodoagency.com/partner'],
      ['r10', 'Paolo Marchi', 'Sales manager', 'Rete Sei', 'Email non trovata', 'none', 70, 'Lavora con catene di ristorazione nel Nord Italia.', 'retesei.it/casi']
    ];
    const C = { ok: ['Verificata', 'rgba(0,188,125,0.12)', 'var(--zb-pos-fg)'], catch: ['Catch-all', 'rgba(254,154,0,0.14)', 'var(--zb-warn-fg)'], none: ['Da completare', 'rgba(98,116,142,0.12)', 'var(--zb-neu-fg)'] };
    const all = D.map(([id, name, role, company, email, st, fit, why, src]) => ({
      id, name, role, company, email, st, fit: String(fit), why, src, chip: C[st][0], chipBg: C[st][1], chipFg: C[st][2],
      initials: name.split(' ').map((p) => p[0]).join(''), open: () => this.setState({ sel: id })
    }));
    const rows = S.tab === 'ok' ? all.filter((r) => r.st === 'ok') : S.tab === 'pending' ? all.filter((r) => r.st !== 'ok') : all;
    const tabs = [['all', 'Tutte', '50'], ['ok', 'Consegnate', '47'], ['pending', 'Da completare', '3']].map(([k, label, count]) => {
      const on = S.tab === k;
      return { label, count, sel: on ? 'true' : 'false', bg: on ? 'var(--zb-tint)' : 'var(--zb-bg)', fg: on ? 'var(--zb-ink)' : 'var(--zb-fg)', border: on ? 'var(--zb-ink)' : 'var(--zb-border)', pick: () => this.setState({ tab: k }) };
    });
    const sel = all.find((r) => r.id === S.sel) || false;
    const rt = sel ? S.ratings[sel.id] || '' : '';
    const set = (v) => this.setState({ ratings: { ...S.ratings, [sel.id]: rt === v ? '' : v } });
    return {
      theme, themeClass: theme === 'dark' ? 'zb-dark' : '',
      menu: S.menu, openMenu: () => this.setState({ menu: true }), closeMenu: () => this.setState({ menu: false }),
      nav: { chat: h('M-Chat.dc.html'), approve: h('M-Approve.dc.html') },
      rows, tabs, sel, close: () => this.setState({ sel: null }),
      goodPressed: rt === 'good' ? 'true' : 'false', badPressed: rt === 'bad' ? 'true' : 'false',
      goodBg: rt === 'good' ? 'rgba(0,188,125,0.12)' : 'var(--zb-bg)', goodFg: rt === 'good' ? 'var(--zb-pos-fg)' : 'var(--zb-fg)', goodBorder: rt === 'good' ? 'rgba(0,188,125,0.45)' : 'var(--zb-border)',
      badBg: rt === 'bad' ? 'rgba(251,44,54,0.10)' : 'var(--zb-bg)', badFg: rt === 'bad' ? 'var(--zb-neg-fg)' : 'var(--zb-fg)', badBorder: rt === 'bad' ? 'rgba(251,44,54,0.40)' : 'var(--zb-border)',
      rateGood: () => set('good'), rateBad: () => set('bad')
    };
  }
}
</script>
</body>
</html>
