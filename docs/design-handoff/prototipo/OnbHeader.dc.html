<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Zenbree · Intestazione onboarding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./fonts.css">
<style>
:root{--zb-bg:#f8fcfb;--zb-fg:#07191d;--zb-card:#f2f7f6;--zb-muted:#edf3f2;--zb-muted-fg:#596669;--zb-border:#d5e1df;--zb-brand:#006679;--zb-brand-hover:#00576a;--zb-ink:#006679;--zb-ink-hover:#004d5c;--zb-on-brand:#f8fcfb;--zb-tint:#d0f0f9;--zb-rail:#e6f0ee;--zb-rail-hover:#dde9e7;--zb-pos-fg:#007a55;--zb-warn-fg:#bb4d00;--zb-neg-fg:#c10007;--zb-ai-fg:#8200db;--zb-info-fg:#1447e6;--zb-neu-fg:#314158;--zb-social-fg:#007595}
.zb-dark{color-scheme:dark;--zb-bg:#0e1515;--zb-fg:#ecf1f1;--zb-card:#141c1b;--zb-muted:#1a2221;--zb-muted-fg:#929e9d;--zb-border:#27302f;--zb-brand:#03758b;--zb-brand-hover:#036a7e;--zb-ink:#69c7df;--zb-ink-hover:#8fdbf0;--zb-on-brand:#f8fcfb;--zb-tint:#093641;--zb-rail:#101817;--zb-rail-hover:#1a2322;--zb-pos-fg:#5ee9b5;--zb-warn-fg:#ffd230;--zb-neg-fg:#ff6467;--zb-ai-fg:#dab2ff;--zb-info-fg:#8ec5ff;--zb-neu-fg:#cad5e2;--zb-social-fg:#53eafd}
body{margin:0}
</style>
</helmet>
<header class="{{themeClass}}" style="box-sizing: border-box; width: 100%; height: 64px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px; padding: 0 28px; background: var(--zb-bg); border-bottom: 1px solid var(--zb-border); font-family: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif; color: var(--zb-fg); font-size: 13px">
  <div style="display: flex; align-items: center; gap: 10px">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none"><rect x="1" y="1" width="22" height="22" rx="7" style="fill: var(--zb-brand)"></rect><path d="M7 8.5h10L7 15.5h10" stroke="#f8fcfb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em">zenbree</span>
  </div>

  <ol aria-label="{{stepLabel}}" style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 8px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <li style="display: flex; align-items: center; gap: 8px">
        <span aria-current="{{s.current}}" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 6px; border-radius: 999px; background: {{s.bg}}; color: {{s.fg}}; font-weight: {{s.w}}; white-space: nowrap">
          <span style="width: 22px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: {{s.dotBg}}; color: {{s.dotFg}}">{{s.mark}}</span>
          {{s.label}}
        </span>
        <sc-if value="{{s.line}}" hint-placeholder-val="{{true}}"><span style="width: 32px; height: 1px; background: var(--zb-border)"></span></sc-if>
      </li>
    </sc-for>
  </ol>

  <div style="display: flex; justify-content: flex-end">
    <a href="{{skipHref}}" style="height: 36px; padding: 0 12px; border-radius: 10.5px; color: var(--zb-muted-fg); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap">Salta per ora</a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"step":{"editor":"enum","options":["1","2","3"],"default":"1"},"$preview":{"width":1440,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const cur = Number(this.props.step ?? '1');
    const labels = ['Azienda', 'Profilo', 'Segmenti'];
    const steps = labels.map((label, i) => {
      const n = i + 1;
      const done = n < cur, on = n === cur;
      return {
        label, line: n < 3, current: on ? 'step' : 'false',
        mark: done ? '✓' : String(n),
        bg: on ? 'var(--zb-tint)' : 'transparent',
        fg: on ? 'var(--zb-ink)' : done ? 'var(--zb-fg)' : 'var(--zb-muted-fg)',
        w: on ? '600' : '500',
        dotBg: on || done ? 'var(--zb-brand)' : 'var(--zb-rail)',
        dotFg: on || done ? 'var(--zb-on-brand)' : 'var(--zb-muted-fg)'
      };
    });
    return {
      themeClass: theme === 'dark' ? 'zb-dark' : '',
      steps,
      stepLabel: 'Passo ' + cur + ' di 3',
      skipHref: (theme === 'dark' ? 'Dark-' : '') + 'Empty-Home.dc.html'
    };
  }
}
</script>
</body>
</html>
