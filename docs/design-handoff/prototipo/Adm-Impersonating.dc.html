<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Zenbree · Backoffice · Impersonificazione</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./fonts.css">
<style>
:root{--zb-bg:#f8fcfb;--zb-fg:#07191d;--zb-card:#f2f7f6;--zb-muted:#edf3f2;--zb-muted-fg:#596669;--zb-border:#d5e1df;--zb-brand:#006679;--zb-brand-hover:#00576a;--zb-ink:#006679;--zb-ink-hover:#004d5c;--zb-on-brand:#f8fcfb;--zb-tint:#d0f0f9;--zb-rail:#e6f0ee;--zb-rail-hover:#dde9e7;--zb-pos-fg:#007a55;--zb-warn-fg:#bb4d00;--zb-neg-fg:#c10007;--zb-ai-fg:#8200db;--zb-info-fg:#1447e6;--zb-neu-fg:#314158;--zb-social-fg:#007595;--zb-chart-3:#ba7e15}
.zb-dark{color-scheme:dark;--zb-bg:#0e1515;--zb-fg:#ecf1f1;--zb-card:#141c1b;--zb-muted:#1a2221;--zb-muted-fg:#929e9d;--zb-border:#27302f;--zb-brand:#03758b;--zb-brand-hover:#036a7e;--zb-ink:#69c7df;--zb-ink-hover:#8fdbf0;--zb-on-brand:#f8fcfb;--zb-tint:#093641;--zb-rail:#101817;--zb-rail-hover:#1a2322;--zb-pos-fg:#5ee9b5;--zb-warn-fg:#ffd230;--zb-neg-fg:#ff6467;--zb-ai-fg:#dab2ff;--zb-info-fg:#8ec5ff;--zb-neu-fg:#cad5e2;--zb-social-fg:#53eafd;--zb-chart-3:#ebb260}
:root{--zb-chart-1:#223034;--zb-chart-2:#006679}
.zb-dark{--zb-chart-1:#c7d0cf;--zb-chart-2:#3fb5d1}
body{margin:0;background:var(--zb-bg)}
a{color:var(--zb-ink)}a:hover{color:var(--zb-ink-hover)}
.zb-field{box-sizing:border-box;height:40px;border-radius:10.5px;border:1px solid var(--zb-border);background:var(--zb-bg);font-family:inherit;font-size:14px;color:var(--zb-fg);padding:0 12px}
.zb-field:focus{outline:2px solid var(--zb-ink);outline-offset:-1px}
.h1{margin:0;font-family:Newsreader,'Iowan Old Style',Georgia,serif;font-weight:400;font-size:44px;line-height:1.18;letter-spacing:0}
.h2{margin:0;font-size:16px;font-weight:700}
.sub{margin:0;color:var(--zb-muted-fg);line-height:1.5}
.mono{font-family:'Atkinson Hyperlegible Mono',ui-monospace,monospace}
.tw{border:1px solid var(--zb-border);border-radius:14px;overflow:hidden}
.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{padding:10px 14px;font-weight:600;font-size:12px;color:var(--zb-muted-fg);text-align:left;background:var(--zb-rail);white-space:nowrap}
.t td{padding:9px 14px;border-top:1px solid var(--zb-muted);vertical-align:middle}
.t tbody tr:hover{background:var(--zb-muted)}
.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.b1{height:36px;padding:0 14px;border:0;border-radius:10.5px;background:var(--zb-brand);color:var(--zb-on-brand);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.b1:hover{background:var(--zb-brand-hover);color:var(--zb-on-brand)}
.b1:disabled{opacity:.45;cursor:not-allowed}
.b2{height:36px;padding:0 12px;border-radius:10.5px;border:1px solid var(--zb-border);background:var(--zb-bg);color:var(--zb-fg);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.b2:hover{background:var(--zb-muted);color:var(--zb-fg)}
.bd{background:var(--zb-neg-fg);color:var(--zb-bg)}
.bd:hover{background:var(--zb-neg-fg);opacity:.9;color:var(--zb-bg)}
.pill{height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-sizing:border-box}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--zb-border);background:var(--zb-bg);color:var(--zb-fg);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--zb-tint);border-color:transparent;color:var(--zb-ink)}
.card{border:1px solid var(--zb-border);border-radius:17.5px;background:var(--zb-card);padding:16px}
.kpi dt{font-size:12px;color:var(--zb-muted-fg);font-weight:600}
.kpi dd{margin:4px 0 0;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--zb-fg);font-family:inherit;font-size:13px;text-align:left;cursor:pointer;white-space:nowrap;text-decoration:none;box-sizing:border-box}
.mi:hover{background:var(--zb-muted);color:var(--zb-fg)}
.ib{width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--zb-muted-fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:var(--zb-rail-hover);color:var(--zb-fg)}
.tab{height:44px;padding:0 4px;border:0;border-bottom:2px solid transparent;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--zb-muted-fg);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected=true]{color:var(--zb-fg);border-bottom-color:var(--zb-ink)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:0;cursor:pointer;flex-shrink:0;padding:0}
.sw span{position:absolute;top:3px;width:18px;height:18px;border-radius:999px;background:var(--zb-bg);transition:left .15s}
</style>
</helmet>
<div class="{{themeClass}}" style="min-height: 100vh; display: flex; flex-direction: column; background: var(--zb-bg); font-family: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif">
  <div role="status" style="position: sticky; top: 0; z-index: 40; height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--zb-fg); color: var(--zb-bg); font-size: 13px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    <span style="flex-grow: 1">Stai usando Zenbree come <strong>ale@ritmosales.it</strong>. Vedi quello che vede lui; ogni azione resta registrata a nome di Giorgia Neri.</span>
    <span class="mono" style="font-size: 12px; opacity: 0.75">scade tra 59 min</span>
    <a href="{{nav.back}}" style="height: 30px; padding: 0 12px; border-radius: 7px; background: var(--zb-bg); color: var(--zb-fg); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap">Termina e torna al backoffice</a>
  </div>
  <div style="flex-grow: 1; min-height: 0">
    <dc-import name="Main" theme="{{theme}}" hint-size="100%,900px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":944}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const h = (p) => (theme === 'dark' ? 'Dark-' : '') + p;
    return { theme, themeClass: theme === 'dark' ? 'zb-dark' : '', nav: { back: h('Adm-User.dc.html') } };
  }
}
</script>
</body>
</html>
