<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Zenbree · Backoffice · navigazione</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./fonts.css">
<style>
:root{--zb-bg:#f8fcfb;--zb-fg:#07191d;--zb-card:#f2f7f6;--zb-muted:#edf3f2;--zb-muted-fg:#596669;--zb-border:#d5e1df;--zb-brand:#006679;--zb-brand-hover:#00576a;--zb-ink:#006679;--zb-ink-hover:#004d5c;--zb-on-brand:#f8fcfb;--zb-tint:#d0f0f9;--zb-rail:#e6f0ee;--zb-rail-hover:#dde9e7;--zb-pos-fg:#007a55;--zb-warn-fg:#bb4d00;--zb-neg-fg:#c10007;--zb-ai-fg:#8200db;--zb-info-fg:#1447e6;--zb-neu-fg:#314158;--zb-social-fg:#007595;--zb-chart-3:#ba7e15}
.zb-dark{color-scheme:dark;--zb-bg:#0e1515;--zb-fg:#ecf1f1;--zb-card:#141c1b;--zb-muted:#1a2221;--zb-muted-fg:#929e9d;--zb-border:#27302f;--zb-brand:#03758b;--zb-brand-hover:#036a7e;--zb-ink:#69c7df;--zb-ink-hover:#8fdbf0;--zb-on-brand:#f8fcfb;--zb-tint:#093641;--zb-rail:#101817;--zb-rail-hover:#1a2322;--zb-pos-fg:#5ee9b5;--zb-warn-fg:#ffd230;--zb-neg-fg:#ff6467;--zb-ai-fg:#dab2ff;--zb-info-fg:#8ec5ff;--zb-neu-fg:#cad5e2;--zb-social-fg:#53eafd;--zb-chart-3:#ebb260}
:root{--zb-chart-1:#223034;--zb-chart-2:#006679}
.zb-dark{--zb-chart-1:#c7d0cf;--zb-chart-2:#3fb5d1}
body{margin:0;background:var(--zb-bg)}
a{color:var(--zb-ink)}a:hover{color:var(--zb-ink-hover)}
.zb-field{box-sizing:border-box;height:40px;border-radius:10.5px;border:1px solid var(--zb-border);background:var(--zb-bg);font-family:inherit;font-size:14px;color:var(--zb-fg);padding:0 12px}
.zb-field:focus{outline:2px solid var(--zb-ink);outline-offset:-1px}
.h1{margin:0;font-family:Newsreader,'Iowan Old Style',Georgia,serif;font-weight:400;font-size:44px;line-height:1.18;letter-spacing:0}
.h2{margin:0;font-size:16px;font-weight:700}
.sub{margin:0;color:var(--zb-muted-fg);line-height:1.5}
.mono{font-family:'Atkinson Hyperlegible Mono',ui-monospace,monospace}
.tw{border:1px solid var(--zb-border);border-radius:14px;overflow:hidden}
.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{padding:10px 14px;font-weight:600;font-size:12px;color:var(--zb-muted-fg);text-align:left;background:var(--zb-rail);white-space:nowrap}
.t td{padding:9px 14px;border-top:1px solid var(--zb-muted);vertical-align:middle}
.t tbody tr:hover{background:var(--zb-muted)}
.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.b1{height:36px;padding:0 14px;border:0;border-radius:10.5px;background:var(--zb-brand);color:var(--zb-on-brand);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.b1:hover{background:var(--zb-brand-hover);color:var(--zb-on-brand)}
.b1:disabled{opacity:.45;cursor:not-allowed}
.b2{height:36px;padding:0 12px;border-radius:10.5px;border:1px solid var(--zb-border);background:var(--zb-bg);color:var(--zb-fg);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.b2:hover{background:var(--zb-muted);color:var(--zb-fg)}
.bd{background:var(--zb-neg-fg);color:var(--zb-bg)}
.bd:hover{background:var(--zb-neg-fg);opacity:.9;color:var(--zb-bg)}
.pill{height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-sizing:border-box}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--zb-border);background:var(--zb-bg);color:var(--zb-fg);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--zb-tint);border-color:transparent;color:var(--zb-ink)}
.card{border:1px solid var(--zb-border);border-radius:17.5px;background:var(--zb-card);padding:16px}
.kpi dt{font-size:12px;color:var(--zb-muted-fg);font-weight:600}
.kpi dd{margin:4px 0 0;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--zb-fg);font-family:inherit;font-size:13px;text-align:left;cursor:pointer;white-space:nowrap;text-decoration:none;box-sizing:border-box}
.mi:hover{background:var(--zb-muted);color:var(--zb-fg)}
.ib{width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--zb-muted-fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:var(--zb-rail-hover);color:var(--zb-fg)}
.tab{height:44px;padding:0 4px;border:0;border-bottom:2px solid transparent;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--zb-muted-fg);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected=true]{color:var(--zb-fg);border-bottom-color:var(--zb-ink)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.sw{position:relative;width:40px;height:24px;border-radius:999px;border:0;cursor:pointer;flex-shrink:0;padding:0}
.sw span{position:absolute;top:3px;width:18px;height:18px;border-radius:999px;background:var(--zb-bg);transition:left .15s}
</style>
</helmet>
<nav class="{{themeClass}}" aria-label="Backoffice" style="box-sizing: border-box; width: 232px; height: 100vh; position: sticky; top: 0; background: var(--zb-rail); color: var(--zb-fg); padding: 16px 12px; display: flex; flex-direction: column; gap: 18px; font-family: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif; font-size: 14px; border-right: 1px solid var(--zb-border)">
  <div style="display: flex; align-items: center; gap: 9px; padding: 0 6px">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none"><rect x="1" y="1" width="22" height="22" rx="7" style="fill: var(--zb-brand)"></rect><path d="M7 8.5h10L7 15.5h10" stroke="#f8fcfb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="font-size: 17px; font-weight: 700">zenbree</span>
    <span class="pill" style="background: var(--zb-fg); color: var(--zb-bg); height: 20px; font-size: 11px">Backoffice</span>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10.5px; background: rgba(254,154,0,0.14); color: var(--zb-warn-fg); font-size: 12px; font-weight: 600; line-height: 1.35">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
    Produzione · le modifiche valgono per tutti
  </div>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <a href="{{u.href}}" aria-current="{{u.current}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10.5px; text-decoration: none; background: {{u.bg}}; color: {{u.fg}}; font-weight: {{u.w}}; white-space: nowrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21v-1a7 7 0 0 1 14 0v1M16 3.5a4 4 0 0 1 0 9M22 21v-1a7 7 0 0 0-4-6.3"></path></svg>
      <span style="flex-grow: 1">{{u.label}}</span>
      <sc-if value="{{u.badge}}" hint-placeholder-val="{{false}}"><span class="pill" title="{{u.badgeTitle}}" style="height: 20px; min-width: 20px; justify-content: center; padding: 0 6px; background: {{u.badgeBg}}; color: {{u.badgeFg}}; font-size: 11px">{{u.badge}}</span></sc-if>
    </a>
    <a href="{{c.href}}" aria-current="{{c.current}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10.5px; text-decoration: none; background: {{c.bg}}; color: {{c.fg}}; font-weight: {{c.w}}; white-space: nowrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="m7 15 4-4 3 3 6-7"></path></svg>
      <span style="flex-grow: 1">{{c.label}}</span>
      <sc-if value="{{c.badge}}" hint-placeholder-val="{{false}}"><span class="pill" title="{{c.badgeTitle}}" style="height: 20px; min-width: 20px; justify-content: center; padding: 0 6px; background: {{c.badgeBg}}; color: {{c.badgeFg}}; font-size: 11px">{{c.badge}}</span></sc-if>
    </a>
    <a href="{{j.href}}" aria-current="{{j.current}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10.5px; text-decoration: none; background: {{j.bg}}; color: {{j.fg}}; font-weight: {{j.w}}; white-space: nowrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 9h10M7 13h6M7 17h3"></path></svg>
      <span style="flex-grow: 1">{{j.label}}</span>
      <sc-if value="{{j.badge}}" hint-placeholder-val="{{false}}"><span class="pill" title="{{j.badgeTitle}}" style="height: 20px; min-width: 20px; justify-content: center; padding: 0 6px; background: {{j.badgeBg}}; color: {{j.badgeFg}}; font-size: 11px">{{j.badge}}</span></sc-if>
    </a>
    <a href="{{s.href}}" aria-current="{{s.current}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10.5px; text-decoration: none; background: {{s.bg}}; color: {{s.fg}}; font-weight: {{s.w}}; white-space: nowrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
      <span style="flex-grow: 1">{{s.label}}</span>
      <sc-if value="{{s.badge}}" hint-placeholder-val="{{false}}"><span class="pill" title="{{s.badgeTitle}}" style="height: 20px; min-width: 20px; justify-content: center; padding: 0 6px; background: {{s.badgeBg}}; color: {{s.badgeFg}}; font-size: 11px">{{s.badge}}</span></sc-if>
    </a>
  </div>
  <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid var(--zb-border)">
    <span class="mono" style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--zb-muted-fg); padding: 0 10px 6px">Strumenti</span>
    <a href="#" target="_blank" rel="noreferrer" title="Monitor delle code dei job (si apre in una nuova scheda)" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10.5px; text-decoration: none; color: var(--zb-fg); white-space: nowrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>
      <span style="flex-grow: 1">Flower</span><span aria-hidden="true" style="color: var(--zb-muted-fg)">↗</span>
    </a>
  </div>
  <span style="flex-grow: 1"></span>
  <a href="{{nav.app}}" class="b2" style="justify-content: center; height: 38px">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    Torna all'app
  </a>
  <div style="display: flex; align-items: center; gap: 10px; padding: 8px 4px 0; border-top: 1px solid var(--zb-border)">
    <span style="width: 32px; height: 32px; border-radius: 999px; background: var(--zb-fg); color: var(--zb-bg); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0">GN</span>
    <span style="min-width: 0; display: flex; flex-direction: column; line-height: 1.25; font-size: 13px"><span style="font-weight: 600">Giorgia Neri</span><span style="font-size: 12px; color: var(--zb-muted-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">admin · team Zenbree</span></span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"active":{"editor":"enum","options":["users","costs","jobs","settings"],"default":"users"},"$preview":{"width":232,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const a = this.props.active ?? 'users';
    const h = (p) => (theme === 'dark' ? 'Dark-' : '') + p;
    const I = (k, label, href, badge, kind, badgeTitle) => {
      const on = a === k;
      return { label, href: h(href), current: on ? 'page' : 'false',
        bg: on ? 'var(--zb-tint)' : 'transparent', fg: on ? 'var(--zb-ink)' : 'var(--zb-fg)', w: on ? '600' : '500',
        badge: badge || false, badgeTitle: badgeTitle || '',
        badgeBg: kind === 'neg' ? 'rgba(251,44,54,0.14)' : 'rgba(254,154,0,0.16)',
        badgeFg: kind === 'neg' ? 'var(--zb-neg-fg)' : 'var(--zb-warn-fg)' };
    };
    return {
      themeClass: theme === 'dark' ? 'zb-dark' : '',
      nav: { app: h('Main.dc.html') },
      u: I('users', 'Utenti', 'Adm-Users.dc.html'),
      c: I('costs', 'Costi', 'Adm-Costs.dc.html'),
      j: I('jobs', 'Job', 'Adm-Jobs.dc.html', '2', 'neg', '2 job da guardare: 1 fallito, 1 in attesa di input'),
      s: I('settings', 'Impostazioni', 'Adm-Settings.dc.html', '1', 'warn', '1 fornitore disattivato')
    };
  }
}
</script>
</body>
</html>
